# GlassBox AI Quant — all tunable constants live here, never in code.
# Contest values. Fork for live use by changing this file, not the framework.

account:
  starting_equity: 100000        # contest requirement
  paper: true

risk:
  # Base risk R as % of equity.
  #
  # Raised to 1.0 on Sat 30 Aug; reverted to 0.5 on Mon 31 Aug, day one of the
  # measurement window, because the raise rested on a claim that turned out to
  # be false. That claim was "the delta band caps SPY at a single spread
  # whatever R says" — assuming the band would self-limit size. It does not:
  # the gate is a binary veto, not a size reducer. At R=1.0 the sizer asked for
  # 2 SPY spreads carrying -$48,119 of delta against the +/-$40,000 band, and
  # the trade was refused outright rather than trimmed to the 1 spread that
  # fits at roughly -$24,000. The 31 Aug audit log holds both cases: two qty=1
  # candidates that cleared the band, and two qty=2 candidates that did not.
  #
  # R=1.0 and delta_dollars_band=40000 are jointly inconsistent on the
  # highest-notional underlying, so one had to give. Reverting R is the
  # risk-REDUCING resolution and restores the value every pre-contest test ran
  # under. Raising the band was the alternative and is explicitly rejected:
  # loosening a directional-exposure limit in order to obtain trades is
  # optimisation on contest data, which this project forbids itself.
  #
  # RESTORED to 1.0 on 1 Sep, after the interaction that forced the revert was
  # fixed: the pipeline now fits qty to the delta band (trader.py step 6b)
  # instead of asking the gate a yes/no question about a number sizing never
  # saw. With that in place the original pre-window reasoning stands — the
  # abstaining meta-labeler multiplies budgets down to 0.4-0.5x, and at
  # R=0.5 that produced ~$200-300 budgets that int(budget // risk) turned into
  # zero contracts for most spreads (31 Aug: ten tradable edges died there,
  # one $7 short of a single contract). The full history — raised, interaction
  # found on day one, reverted, interaction fixed, restored — is in the README
  # and the audit log. The delta band itself has never moved.
  r_per_trade_pct: 1.0
  max_loss_per_position_pct: 1.5
  max_loss_per_underlying_pct: 3.0
  portfolio_heat_pct: 6.0        # sum of max-loss across open positions
  # Net |delta $| limit. Calibrated against live data Fri Aug 28: one 1-lot
  # ATM SPY debit vertical carries $25-35k of delta-dollars (0.3-0.45 delta
  # x 100 x ~$770 spot), so the original 15000 vetoed the strategy's own core
  # structure on its most liquid underlying. 40000 fits ~1.3 such verticals
  # while still capping the book's directional exposure.
  delta_dollars_band: 40000
  daily_loss_halt_pct: 2.0       # supervisor: flatten + halt for session
  max_drawdown_halt_pct: 6.0     # supervisor: flatten + halt, manual reset
  loss_streak_half_size: 4       # consecutive losses before halving R
  min_meta_label_p: 0.55         # below this, no trade

sizing:
  # Reference daily vol for the volatility budget: vol_budget scales risk by
  # target_daily_vol / realised_vol. Was hardcoded at 0.01, which zeroed any
  # name above ~2.2% daily vol (live Fri: NVDA had $342 of fixed-fractional
  # budget but a $200 vol budget -> no trade). 0.02 sizes one spread up to
  # ~4.5% daily vol; hotter names still shrink toward zero as intended.
  target_daily_vol: 0.02
  # Risk limits are backstops, not operating points. A portfolio approaching its
  # budget should take smaller bites, not identical ones until it hits a wall.
  # Below the start fraction nothing changes; between there and the cap the
  # multiplier tapers linearly to the floor. The gate's hard veto still stands
  # behind both — these only decide how gracefully we arrive at it.
  heat_taper_start: 0.6      # fraction of the heat cap where tapering begins
  heat_taper_floor: 0.3
  drawdown_taper_start: 0.5  # fraction of the daily-loss limit
  drawdown_taper_floor: 0.3
  meta_multiplier_floor: 0.4     # multiplier at p = min_meta_label_p
  meta_multiplier_ceiling: 1.0   # multiplier at p >= meta_multiplier_ceiling_p
  # Conviction at which sizing stops scaling up. We never lever up on high
  # confidence beyond this: confidence is the model's opinion, the cap is our
  # policy.
  meta_multiplier_ceiling_p: 0.85

execution:
  # Entry orders are patient but not infinite: a news thesis is time-sensitive,
  # and an order still resting after this long is a fill the market declined at
  # our price. It is cancelled and the position abandoned rather than chased.
  entry_fill_timeout_minutes: 4
  # Bounded entry ladder (added 2 Sep, from 1 Sep's measured fill rate):
  # closes escalate until filled (1/1 filled) while entries sat at their first
  # price and died (3/7 — GOOGL, XOM, ORCL, CVX all expired untouched), with
  # the router's PriceLadder built for exactly this and never wired. After
  # each step_seconds resting, the entry concedes one tick — pay a cent more
  # of debit, accept a cent less of credit — at most `steps` times, then the
  # timeout above still kills it. Worst-case concession per spread is
  # steps x tick x 100 = $2: a bounded crossing of quote noise, not a chase.
  entry_ladder_steps: 2
  entry_ladder_step_seconds: 80
  entry_ladder_tick: 0.01
  # Each rung concedes the larger of the tick above and this fraction of the
  # structure's quoted spread — a flat cent was measured meaningless against
  # wide quotes (UBER: two cents on a 30% spread, twice, no fill; every fill
  # of the week came inside 60s on a narrow quote). Total concession across
  # all rungs is capped at this share of the entry price, so a wide quote is
  # crossed proportionally, never chased.
  entry_ladder_spread_fraction: 0.25
  entry_ladder_max_concession_pct: 15
  # Close orders are the opposite — we are obligated to get out. An unfilled
  # close escalates: cancelled and resubmitted at a progressively worse price,
  # crossing further toward the market each attempt.
  close_retry_seconds: 60
  # Every broker HTTP call gets a hard timeout. alpaca-py sets none, and a
  # request without one blocks forever on a half-open socket — in the trader
  # that wedges a thread; in the supervisor it silently disables every guard.
  broker_connect_timeout_seconds: 10
  broker_read_timeout_seconds: 30
  close_max_attempts: 4
  close_escalation_pct: 12   # each retry concedes this much more of the price

gate:
  max_orders_per_minute: 5
  max_new_positions_per_day: 10
  # Option spreads are wide and implied vol is unstable while the market finds
  # its footing after the open, and the last stretch carries closing-auction
  # noise on top of the same problem. The liquidity check catches some of this
  # incidentally; these make it deliberate.
  skip_first_minutes: 15
  skip_last_minutes: 20
  # A thesis at or under this many hours is intraday and must resolve inside the
  # session. Above it, holding overnight is the stated intent.
  intraday_horizon_hours: 8.0
  # How much of an intraday horizon must fit before the close. A four-hour
  # thesis entered with forty minutes left cannot resolve; we would be paying
  # entry cost for an outcome that has no room to occur.
  min_session_fraction: 0.5
  # Option liquidity check — measured in INDICATIVE-feed units, and that
  # matters. This cap is compared against quotes from Alpaca's free indicative
  # feed, which soak/spread_calibration.py measured against real OPRA prints
  # from the 31 Aug session: contracts printing 200-1,475 times at 1.4-3.0%
  # effective spread were being quoted at 15.0-17.3% by the feed (5-12x
  # inflation on single names; SPY only ~1.3-2x). At 10.0 the check was
  # refusing genuinely liquid trades — AMZN was vetoed at a measured 15.0% on
  # a leg that printed 1,475 times at ~1.9% real. 20.0 in indicative units is
  # roughly 3-4% of real spread for print-rich names, while genuinely thin
  # books (XLK condor legs: 13-25 prints/day, quoted 34.7%) stay excluded.
  # History: 5.0 -> 10.0 on Fri (live calibration), 10.0 -> 20.0 on 1 Sep
  # (feed-inflation measurement). Slippage protection does not live here
  # anyway: entries start at mid and the price ladder bounds what a wide
  # market can cost; this check exists to exclude dead contracts, which the
  # OI floor below also enforces.
  max_spread_pct_of_mid: 20.0
  min_open_interest: 200
  # The spread is judged on a rolling median, not a snapshot. The indicative
  # feed swings tens of percent minute to minute (UBER 2 Sep: 30.8% at 13:38,
  # under 20% at 13:49 and 15:55, and unfillable at all three) — one
  # instant's quote is noise. With fewer observations than the minimum, the
  # snapshot is used as before. Open interest is a daily figure and needs
  # no window.
  liquidity_window_minutes: 10
  liquidity_min_observations: 3
  # Concentration. Two positions in one underlying is already a doubled thesis;
  # a third is a bet, not a portfolio. The dollar cap above
  # (max_loss_per_underlying_pct) is the backstop — this is the count.
  max_positions_per_underlying: 2
  # The same limit across names that move together: two positions in correlated
  # names are one position with extra commission.
  max_correlated_positions: 2
  # Pairwise correlation at or above which two underlyings count as the same
  # bet for the check above.
  correlation_threshold: 0.7

manage:
  # Credit structures: bank half the premium rather than grinding the last of it
  # out against accelerating gamma, and stop at 1.5x the credit received.
  # Stops tightened 1 Sep (2.0x -> 1.5x, 50% -> 40%, trigger 60 -> 50) on
  # operator instruction, paired with the overnight-carry policy: positions
  # are no longer dumped at the bell for calendar reasons, so the intraday
  # stop is the layer that cuts losers early and decides what earns the right
  # to carry. Both values sit inside standard defined-risk practice
  # (credits managed at 1.5-2x, debits at 30-50%).
  credit_profit_take_pct: 50
  stop_multiple_of_credit: 1.5
  # Debit structures: take profit at a full double, cut at 40% of the debit.
  debit_profit_take_pct: 100
  debit_stop_pct: 40
  breakeven_trigger_pct: 50      # tighten stop to entry at 50% of target
  # Trailing lock (2 Sep): once the peak reaches trail_arm_pct of the target,
  # the position closes if P&L falls to trail_keep_pct of that peak. TLT on
  # 1 Sep peaked at +$306 (78% of a +$391 target) and gave back $170 by the
  # bell — between a full-double target and a zero floor nothing banked any
  # of it. Arms above the break-even trigger so the two form a ladder:
  # 50-60% of target protects zero; above 60% protects half the peak.
  trail_arm_pct: 60
  trail_keep_pct: 50
  min_hours_to_expiry: 24
  # An entry thesis should have an expiry condition, not only an expiry date.
  # Contradiction: later news on a held symbol that reverses the view we opened
  # on. The bar is deliberately higher than the entry bar — an unrelated story
  # reading mildly bearish must not churn a position, so only a confident and
  # material reversal counts.
  exit_on_contradiction: true
  contradiction_min_confidence: 0.70
  contradiction_min_materiality: 0.60
  # Completion: the underlying has travelled the distance we predicted. The move
  # we forecast has happened, so there is nothing left to wait for — which is a
  # different question from whether P&L reached its target.
  exit_on_thesis_complete: true
  thesis_complete_fraction: 1.0
  # An intraday horizon is truncated to the close MINUS this buffer. Found
  # 1 Sep: TLT's horizon was truncated to exactly 20:00:01 and the manager's
  # last open-market tick was 19:59:36, so the TIME barrier that should have
  # banked +$272 at the bell was unreachable — the position carried overnight
  # by accident, not by policy. Five minutes matches the deadline flatten's
  # own margin before the close.
  bell_buffer_minutes: 5
  # The bell gate (2 Sep): inside the buffer above, may a position carry
  # overnight? No barrier can act from the bell to the next open — the only
  # protection is the wing — so "carry" is a conditional decision, not a
  # blanket rule. TLT gave back $187 of +$272 in that window on 1 Sep.
  #   1. Friday: everything closes. No position carries a weekend.
  #   2. A scheduled release before the next open closes short premium (the
  #      blackout window is blind premarket: ADP printed 08:15, its window
  #      ended 08:45, the first tick came 09:30). Long vol may carry — a
  #      print is what it wants. A blocking corporate action closes either.
  #   3. A LOSER past this fraction of the way to its stop closes — a gap
  #      would finish it overnight; take the small loss while it is small.
  #   4. A LOSER whose unprotected gap (wing minus stop) exceeds this share
  #      of equity closes — the overnight exposure is out of proportion to
  #      the risk the sizer intended. TLT's gap was $235; TSLA's $25.
  # Winners past their horizon are banked by TIME regardless; a small loser
  # with a tight wing carries, bounded.
  bell_no_weekend_carry: true
  bell_near_stop_fraction: 0.5
  bell_max_unprotected_pct_equity: 0.25
  flatten_all_at: "2026-09-03T15:55:00-04:00"   # Thu before close, ET

signal:
  novelty_window_hours: 72
  min_confidence: 0.6
  # Jaccard overlap above which a headline counts as a restatement of one seen
  # inside the novelty window. The same story reworded by three wires is one
  # signal, not three.
  novelty_similarity_threshold: 0.6
  # A headline shorter than this carries no extractable thesis — a ticker and a
  # verb, typically a data-feed artefact rather than news.
  min_headline_chars: 15
  # Maximum age of a story we will still act on. Referenced by
  # consume_realized_move below, which assumes this window.
  max_news_age_hours: 2
  edge_ratio_debit: 1.3          # expected/implied above this -> long convexity
  edge_ratio_credit: 0.7         # expected/implied below this -> short premium
  # How much of the expected move is treated as already spent. News up to two
  # hours old is accepted, and in that time the market may already have priced
  # it — an "expected 5% vs implied 3%" signal on a name that has already run 5%
  # is really "0% remaining vs 3%", which is the wrong side of a good signal.
  consume_realized_move: true
  # Below this many minutes since the story broke, no adjustment is made: there
  # is not enough tape yet to measure a reaction.
  min_minutes_for_reaction: 2
  # Volatility risk premium: implied move divided by the move the volatility
  # model actually forecasts. Above 1 the options are pricing more movement than
  # the underlying historically delivers, which favours selling premium and
  # penalises buying it. Buying rich optionality is the expensive mistake, so
  # the debit ceiling is the tighter of the two.
  vrp_max_for_debit: 1.35
  # Lowered 0.90 -> 0.72 on 1 Sep (contest day 2), a deliberate in-contest
  # threshold change made on Albert's explicit instruction, logged openly in
  # local/POST-SESSION-REVIEW.md. Rationale: proving an autonomous entry
  # outranks P&L for the submission, and the measured day-2 flow clustered at
  # VRP 0.78-0.81 against an effective floor of 0.94 (regime-shifted from
  # 0.90) — every candidate missing by 0.13-0.16. 0.72 admits that cluster
  # while still refusing the truly thin tail; every other gate check (defined
  # risk, delta band, liquidity, sizing, blackouts) still applies unchanged.
  vrp_min_for_credit: 0.72
  # An implausibly large edge is a data problem, not an opportunity - the same
  # reasoning that rejects a credit above the spread width.
  max_plausible_ratio: 5.0
  # Structure geometry, in percent of spot.
  # Spread wing width: how far the protective leg sits from the short one. The
  # real strike increment from the chain is used when it is wider, so we never
  # request strikes that do not exist.
  wing_width_pct: 1.0
  # Floor on the expected move used for strike selection. Without it a
  # near-zero forecast picks the same strike for both legs, which is not a
  # spread.
  min_move_pct_for_strikes: 0.5
  # How far a PRIMARY leg (the short of a credit, the long of a debit) may
  # move from its target strike, in wing widths, to land on a liquid
  # contract. Wings get one width regardless: a short two notches further
  # out-of-the-money is a more conservative statement of the same view; a
  # wing two notches wider is a different trade. Live check 2 Sep: with one
  # width, AAPL's liquid short (two notches out) was passed over for the
  # illiquid strike and the gate vetoed anyway; AVGO's liquid wing 45
  # points down would have redesigned the spread. Two widths for the
  # primary leg converts the first without permitting the second.
  strike_liquidity_tolerance_widths: 2.0

regime:
  # Cross-asset risk read. Each factor is a percentile of today's value within
  # its own trailing window, so no factor needs a hand-chosen threshold. The
  # composite is the mean of whatever is available; a missing factor drops out
  # rather than defaulting.
  lookback_days: 60
  # Size multiplier at maximum stress. 1.0 in calm markets, tapering linearly to
  # this floor as the composite approaches 1. Regime scales conviction; it never
  # creates or fully vetoes a trade on its own.
  min_size_multiplier: 0.4
  # How far stress shifts the VRP bounds toward selling premium. In a fearful
  # market premium is genuinely richer, so the floor for selling relaxes and the
  # ceiling for buying tightens, each by up to this much.
  max_vrp_shift: 0.15

macro:
  # High-impact scheduled releases. Near one, every straddle carries embedded
  # event premium, which makes the edge test read "overpriced" and steers the
  # system into selling insurance right before the event. Contest week is
  # hand-verified and hardcoded: four dates beat any API for auditability.
  # Times are US Eastern.
  blackout_before_hours: 2.0
  blackout_after_minutes: 30
  # Sizing haircut for non-premium-selling entries inside the window.
  near_event_size_factor: 0.6
  events:
    - { at: "2026-09-01T10:00:00-04:00", name: "ISM Manufacturing + JOLTS" }
    - { at: "2026-09-02T08:15:00-04:00", name: "ADP Employment" }
    - { at: "2026-09-04T08:30:00-04:00", name: "Nonfarm Payrolls" }

floor:
  # The daily best-idea floor. If nothing has traded organically by the trigger
  # time, the single best signal that was refused ONLY for sitting inside the
  # ratio band is expressed at reduced size. Confidence, bad-data, VRP and every
  # gate refusal disqualify a candidate outright — the floor relaxes exactly one
  # bar, once per day, at reduced risk, and the full gate still applies at
  # execution. Enabled for the contest; the nightly calibration decides each day
  # whether it is still needed.
  enabled: true
  after_time_et: "14:00"
  size_factor: 0.5
  # A candidate must at least lean somewhere. Ratio within this distance of 1.0
  # is pure agreement with the market — there is no "best idea" in a coin flip.
  min_ratio_distance: 0.08
  # A floor attempt can legitimately fail — stacked regime and macro haircuts
  # can size it to zero. Conditions change, so it retries, but not every tick.
  retry_after_minutes: 20

universe:
  size: 50
  min_option_volume: 1000

llm:
  provider: fireworks
  base_url: "https://api.fireworks.ai/inference/v1"
  # Verified against this account's catalogue with `python -m glassbox.verify_llm`.
  # Analyst runs on every surviving news event under time pressure, so it is a
  # small fast model doing constrained extraction, not reasoning. The nightly
  # report runs once and can afford a large model.
  analyst_model: "accounts/fireworks/models/gpt-oss-120b"
  # minimax-m3 returns clean prose. Several strong models on this catalogue are
  # unusable here for different reasons: gpt-oss-120b, glm-5p2 and qwen3p7-plus
  # return empty content for free-form text (their output goes to a reasoning
  # channel), and kimi-k3 emits its chain-of-thought into the body. Verified by
  # `python -m glassbox.verify_llm --prose`.
  report_model: "accounts/fireworks/models/minimax-m3"
  analyst_max_tokens: 600
  # Generous on purpose. The report model reasons before answering, and that
  # reasoning is charged against max_tokens — measured at ~3,900 characters of
  # it. Too small a budget truncates the answer to nothing while the request
  # still looks successful.
  report_max_tokens: 2500
  timeout_seconds: 20

dashboard:
  # 8847: deliberately clear of 3000/5000/8000/8080/5173 and other common
  # dev-server defaults so it never collides with another local project.
  port: 8847
  host: "127.0.0.1"

ml:
  # A gradient-boosted model fitted on a handful of trades is noise with a
  # confidence interval. Below this many labelled outcomes the meta-labeler
  # abstains and the analyst's own confidence is used instead — an honest
  # stand-in beats a fabricated one.
  min_training_samples: 30
  # Thompson sampling priors. Beta(1,1) is uniform: every structure starts
  # equally plausible and has to earn its share of the flow.
  bandit_prior_alpha: 1.0
  bandit_prior_beta: 1.0
  # Coarse regime buckets keep the number of cells small enough to actually
  # learn from tens of observations rather than thousands.
  vol_regime_bounds: [0.010, 0.020]

paths:
  db: "data/glassbox.db"
  audit_dir: "audit"
  models_dir: "models"
