#cloud-config
# First-boot provisioning for a GlassBox host (Ubuntu 24.04, 2 GB, US East).
#
# Paste into the provider's "user data" / "cloud-init" field when CREATING an
# instance. Cloud-init only runs on first boot: for a box that already exists,
# run deploy/bootstrap.sh over SSH instead — it does the same work and is
# idempotent.
#
# Replace the ssh key below with your own public key before using this.

users:
  - name: glassbox
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ssh-ed25519 REPLACE_WITH_YOUR_PUBLIC_KEY

package_update: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - ufw

# 2 GB of swap. The stack *runs* in 2 GB of RAM, but building the image on a
# single vCPU is the peak, and an OOM-killed build leaves a broken image that
# fails later in ways that look unrelated.
swap:
  filename: /swapfile
  size: 2147483648

write_files:
  - path: /etc/sysctl.d/99-swappiness.conf
    content: "vm.swappiness=10\n"
  - path: /etc/ssh/sshd_config.d/99-glassbox.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin prohibit-password

runcmd:
  # Docker from the official repository — Ubuntu's packaged docker.io lags and
  # ships no compose plugin.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -qq
  - apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker glassbox
  # Only SSH and the two web ports. The dashboard's 8847 is never published —
  # Caddy reaches it over the compose network.
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl reload ssh

final_message: "GlassBox host ready. Clone the repo, fill .env, docker compose up -d --build"
