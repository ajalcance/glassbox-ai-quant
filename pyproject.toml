[project]
name = "glassbox"
version = "0.1.0"
description = "News-driven, risk-gated AI options trading agent on Alpaca (paper trading)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "alpaca-py>=0.33",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.50",          # OpenAI-compatible client for Fireworks
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glassbox"]
